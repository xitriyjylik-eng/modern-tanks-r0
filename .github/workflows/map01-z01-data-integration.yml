name: Map01 Z01 Runtime Data Integration

on:
  workflow_dispatch:
  push:
    branches:
      - map01-implementation-v1
    paths:
      - 'map01ci/**'
      - '.github/workflows/map01-z01-data-integration.yml'

jobs:
  build-and-smoke:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      SGDK_IMAGE: registry.gitlab.com/doragasu/docker-sgdk:v2.11
      OVERLAY_SHA256: 8a80e2d255ba685e0d17d5b24631e2dfe3bb650f514e441064f30c11da8ad44b

    steps:
      - uses: actions/checkout@v4

      - name: Install tooling
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet Pillow==11.3.0 numpy==2.3.3 scipy==1.16.2
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blastem xvfb xdotool x11-utils

      - name: Reconstruct and verify Map01 overlay
        shell: bash
        run: |
          set -euo pipefail
          cat map01ci/data_overlay.*.b64 | tr -d '\r\n ' | base64 -d > /tmp/map01_data_overlay.tar.gz
          echo "$OVERLAY_SHA256  /tmp/map01_data_overlay.tar.gz" | sha256sum -c -
          gzip -t /tmp/map01_data_overlay.tar.gz
          tar -tzf /tmp/map01_data_overlay.tar.gz

      - name: Normalize R3 transport and restore verified renderer base
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('sgdk/r3ci')
          expected={
            0:'88bb1acbdba9f946338d3cb7313ae5629b4d1c7bb38efa8e6fd98afe0101b293',
            1:'39a455119ee853299e957f1082a931c2d873952fc6840c3f8a48f65dcc2f2868',
            2:'6b6456e097b5173cc68a03f2221dd33f07d09a94f35af454924d00c6ed14c4e8',
            3:'4b7559e86a513c59e5a572e3c5e0118d3372fbca243ec32cc18d43d749d7cda5',
            4:'bbdde87db66c04d2983b67949f8357400affa1a5e5ca8b5718ef11a90cd9d3ee',
            5:'06aa0243144b644515d82de32a091b5d21fb1031a072a41d3c90119256bd7dce',
          }
          def sha(s): return hashlib.sha256(s.encode('ascii')).hexdigest()
          for i,want in expected.items():
              p=root/f'world.{i:02d}.b64'
              s=p.read_text(encoding='ascii').strip()
              if sha(s)!=want and i==4 and len(s)==8001:
                  hits=[]
                  for j in range(len(s)):
                      t=s[:j]+s[j+1:]
                      if sha(t)==want: hits.append((j,t))
                  assert len(hits)==1
                  _,s=hits[0]
                  p.write_text(s,encoding='ascii')
              assert sha(s)==want,(i,len(s),sha(s),want)
          PY
          python3 sgdk/tools/r3_ci_overlay_small.py restore
          python3 sgdk/tools/r3_ci_overlay_small.py verify

      - name: Apply and verify Map01 authored data integration
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/map01_data_overlay.tar.gz -C .
          cat <<'EOF' | sha256sum -c -
          e1e4213bbe7038619c3c3346699b59399556bf35f91e7874b3e344224ea903ac  sgdk/src/map01_runtime.h
          15204a0afcbd1e5d9610b1eec21b0673e11d9e04f803491a1c72b71f5dd13728  sgdk/src/map01_z01_data.h
          9de2ebe57b720d1a3f5784b7057de4e48e889aad2e42e6d3b05132f270f0dd7d  sgdk/src/map01_runtime.c
          e80defebeb5df791aa1cfcc0c5027ab3a93edb0826080e3e46155547293dc029  sgdk/src/map01_z01_data.c
          2262b6e32d0b6511b115dc11533aa9099a01ca5e3d5f22c232e9aed257f62015  sgdk/src/main.c
          EOF
          grep -q 'MAP01_Z01_getPlayerStart' sgdk/src/main.c
          grep -q 'R3 BG = TEMP PLACEHOLDER' sgdk/src/main.c
          python3 sgdk/tools/build_refined_animation_assets.py >/tmp/map01_ambient.log

      - name: Build separate Map01 integration ROM
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$SGDK_IMAGE" >/tmp/map01_docker_pull.log
          ID="$(docker image inspect "$SGDK_IMAGE" --format '{{.Id}}')"
          chmod -R a+rwX sgdk
          docker run --rm -v "$PWD/sgdk:/m68k" "$ID" | tee sgdk/out/MAP01_BUILD_LOG.txt
          test -f sgdk/out/rom.bin
          sha256sum sgdk/out/rom.bin | tee sgdk/out/MAP01_ROM_SHA256.txt
          python3 sgdk/tools/verify_rom.py sgdk/out/rom.bin | tee sgdk/out/MAP01_ROM_AUDIT.json

      - name: Smoke Map01 data integration in BlastEm
        shell: bash
        run: |
          set -euo pipefail
          OUT="$PWD/sgdk/out/map01_smoke"
          RAW="$RUNNER_TEMP/map01-shots"
          HOME_DIR="$RUNNER_TEMP/map01-home"
          mkdir -p "$OUT" "$RAW" "$HOME_DIR/.config/blastem"
          CFG_SRC="$(dpkg -L blastem | grep -E '/default\.cfg$' | head -n1 || true)"
          if [ -n "$CFG_SRC" ]; then cp "$CFG_SRC" "$HOME_DIR/.config/blastem/blastem.cfg"; else printf 'ui {\n}\n' > "$HOME_DIR/.config/blastem/blastem.cfg"; fi
          python3 - "$HOME_DIR/.config/blastem/blastem.cfg" "$RAW" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path(sys.argv[1]); raw=sys.argv[2]
          s=p.read_text(errors='replace')
          if re.search(r'(?m)^\s*screenshot_path\s+',s): s=re.sub(r'(?m)^\s*screenshot_path\s+.*$',f'\tscreenshot_path {raw}',s)
          else: s=s.replace('ui {',f'ui {{\n\tscreenshot_path {raw}',1)
          if re.search(r'(?m)^\s*screenshot_template\s+',s): s=re.sub(r'(?m)^\s*screenshot_template\s+.*$',r'\tscreenshot_template map01_%Y%m%d_%H%M%S.png',s)
          else: s=s.replace('ui {','ui {\n\tscreenshot_template map01_%Y%m%d_%H%M%S.png',1)
          p.write_text(s)
          PY
          export HOME="$HOME_DIR" DISPLAY=:99 SDL_AUDIODRIVER=dummy LIBGL_ALWAYS_SOFTWARE=1
          Xvfb :99 -screen 0 640x480x24 -nolisten tcp >"$OUT/xvfb.log" 2>&1 & XVFB_PID=$!
          for _ in $(seq 1 50); do xdpyinfo -display :99 >/dev/null 2>&1 && break; sleep .1; done
          xdpyinfo -display :99 >/dev/null
          blastem -g -r U sgdk/out/rom.bin 320 224 >"$OUT/blastem.log" 2>&1 & EMU_PID=$!
          trap 'kill ${EMU_PID:-999999} ${XVFB_PID:-999998} 2>/dev/null || true' EXIT
          WIN=''
          for _ in $(seq 1 80); do WIN="$(xdotool search --pid "$EMU_PID" 2>/dev/null | head -n1 || true)"; [ -n "$WIN" ] && break; kill -0 "$EMU_PID" 2>/dev/null || exit 1; sleep .1; done
          test -n "$WIN"
          shot(){ label="$1"; before=$(find "$RAW" -name '*.png' | wc -l); xdotool keydown --window "$WIN" p; sleep .12; xdotool keyup --window "$WIN" p; for _ in $(seq 1 50); do after=$(find "$RAW" -name '*.png' | wc -l); if [ "$after" -gt "$before" ]; then f=$(find "$RAW" -name '*.png' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-); for __ in $(seq 1 40); do python3 - "$f" <<'PY' >/dev/null 2>&1 && break || true
          from PIL import Image
          import sys
          Image.open(sys.argv[1]).verify()
          PY
          sleep .05; done; cp "$f" "$OUT/$label.png"; return; fi; sleep .1; done; return 1; }
          tap(){ xdotool keydown --window "$WIN" "$1"; sleep .25; xdotool keyup --window "$WIN" "$1"; sleep .8; }
          sleep 1.5; shot 01_title; tap Return; shot 02_menu; tap Return; shot 03_battle_start
          xdotool keydown --window "$WIN" Right; sleep 1.2; xdotool keyup --window "$WIN" Right; sleep .5; shot 04_battle_right
          xdotool keydown --window "$WIN" Down; sleep 1.2; xdotool keyup --window "$WIN" Down; sleep .5; shot 05_battle_down
          tap s; shot 06_menu_return
          kill "$EMU_PID" 2>/dev/null || true; wait "$EMU_PID" 2>/dev/null || true; EMU_PID=''
          python3 sgdk/tools/analyze_r3_runtime_smoke.py | tee "$OUT/MAP01_SMOKE_REPORT.json"

      - name: Publish Map01 integration candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Modern_Tanks_Map01_Z01_Data_Integration_Candidate
          path: |
            sgdk/out/rom.bin
            sgdk/out/MAP01_ROM_SHA256.txt
            sgdk/out/MAP01_ROM_AUDIT.json
            sgdk/out/MAP01_BUILD_LOG.txt
            sgdk/out/map01_smoke/*
          if-no-files-found: warn

name: Map01 Z01 Approved World Art Stream

on:
  workflow_dispatch:
  push:
    branches:
      - map01-implementation-v1
    paths:
      - 'map01worldci_exact/**'
      - '.github/workflows/map01-z01-world-art-stream.yml'

jobs:
  build-and-smoke:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      SGDK_IMAGE: registry.gitlab.com/doragasu/docker-sgdk:v2.11
      DATA_OVERLAY_SHA256: 8a80e2d255ba685e0d17d5b24631e2dfe3bb650f514e441064f30c11da8ad44b
      WORLD_OVERLAY_SHA256: 42ffe0414dc8bf36894d459211bf5fe082fa7edbde2983bd3ee933f01ede8bec

    steps:
      - uses: actions/checkout@v4

      - name: Install tooling
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet Pillow==11.3.0 numpy==2.3.3 scipy==1.16.2
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blastem xvfb xdotool x11-utils imagemagick
          python3 -c 'from PIL import Image; import numpy, scipy; print("Map01 world-art tooling PASS")'

      - name: Restore and verify accepted renderer base
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('sgdk/r3ci')
          expected={
            0:'88bb1acbdba9f946338d3cb7313ae5629b4d1c7bb38efa8e6fd98afe0101b293',
            1:'39a455119ee853299e957f1082a931c2d873952fc6840c3f8a48f65dcc2f2868',
            2:'6b6456e097b5173cc68a03f2221dd33f07d09a94f35af454924d00c6ed14c4e8',
            3:'4b7559e86a513c59e5a572e3c5e0118d3372fbca243ec32cc18d43d749d7cda5',
            4:'bbdde87db66c04d2983b67949f8357400affa1a5e5ca8b5718ef11a90cd9d3ee',
            5:'06aa0243144b644515d82de32a091b5d21fb1031a072a41d3c90119256bd7dce',
          }
          def sha(s): return hashlib.sha256(s.encode('ascii')).hexdigest()
          for i,want in expected.items():
              p=root/f'world.{i:02d}.b64'
              s=p.read_text(encoding='ascii').strip()
              if sha(s)!=want and i==4 and len(s)==8001:
                  hits=[]
                  for j in range(len(s)):
                      t=s[:j]+s[j+1:]
                      if sha(t)==want: hits.append((j,t))
                  assert len(hits)==1
                  _,s=hits[0]
                  p.write_text(s,encoding='ascii')
              assert sha(s)==want,(i,len(s),sha(s),want)
          PY
          python3 sgdk/tools/r3_ci_overlay_small.py restore
          python3 sgdk/tools/r3_ci_overlay_small.py verify

      - name: Apply verified Z01 gameplay data
        shell: bash
        run: |
          set -euo pipefail
          cat map01ci/data_overlay.*.b64 | tr -d '\r\n ' | base64 -d > /tmp/map01_data_overlay.tar.gz
          echo "$DATA_OVERLAY_SHA256  /tmp/map01_data_overlay.tar.gz" | sha256sum -c -
          gzip -t /tmp/map01_data_overlay.tar.gz
          tar -xzf /tmp/map01_data_overlay.tar.gz -C .
          cat <<'EOF' | sha256sum -c -
          e1e4213bbe7038619c3c3346699b59399556bf35f91e7874b3e344224ea903ac  sgdk/src/map01_runtime.h
          15204a0afcbd1e5d9610b1eec21b0673e11d9e04f803491a1c72b71f5dd13728  sgdk/src/map01_z01_data.h
          9de2ebe57b720d1a3f5784b7057de4e48e889aad2e42e6d3b05132f270f0dd7d  sgdk/src/map01_runtime.c
          e80defebeb5df791aa1cfcc0c5027ab3a93edb0826080e3e46155547293dc029  sgdk/src/map01_z01_data.c
          EOF

      - name: Apply and verify approved Z01 WORLD_ART streamer
        shell: bash
        run: |
          set -euo pipefail
          cat map01worldci_exact/world_stream_overlay.*.b64 | tr -d '\r\n ' | base64 -d > /tmp/map01_world_stream_overlay.tar.gz
          echo "$WORLD_OVERLAY_SHA256  /tmp/map01_world_stream_overlay.tar.gz" | sha256sum -c -
          gzip -t /tmp/map01_world_stream_overlay.tar.gz
          tar -xzf /tmp/map01_world_stream_overlay.tar.gz -C .
          cat <<'EOF' | sha256sum -c -
          247dec58cf4a15a76cdfeb63503b999c6a00622559f96c2891b4599b876b479a  sgdk/src/main.c
          0810193bd560faac97aeed15e209bff46ea3d3cb46d01fb9307df3329bf6c09b  sgdk/src/map01_world_stream.c
          054fe621ca6a1702588efa98cdba98578382b6764c6e88b8041e57ed108d561f  sgdk/src/map01_world_stream.h
          7d42a70dc1b025813561930446eb212554886f93291e5a8c788c6085252a6bb7  sgdk/res/resources.res
          1360ab88c9dcd35b73caab17b84d61392be6d231a4046dd0a5d1b77b34547ef8  sgdk/res/map01_z01_tile_pixels.bin
          3d31a2bea0afc6aae1468191d3bcf772e45f9e6cb5f74453621f182fe86595c2  sgdk/res/map01_z01_tile_palettes.bin
          8d002df66e0f1805acdc25c1f7b44b43ed5f48dbaeee733776d675340ffa579b  sgdk/tools/verify_map01_z01_world_stream.py
          9f040c2a0fc2254c5977cb81c99ccb5469d938894df96a492508d6d76b4a459d  map01/validation/MAP01_Z01_WORLD_STREAM_CONVERSION.json
          EOF
          python3 sgdk/tools/build_refined_animation_assets.py >/tmp/map01_ambient.log
          python3 sgdk/tools/verify_map01_z01_world_stream.py

      - name: Build separate Z01 WORLD_ART ROM
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$SGDK_IMAGE" >/tmp/map01_world_docker_pull.log
          ID="$(docker image inspect "$SGDK_IMAGE" --format '{{.Id}}')"
          echo "$ID" | tee sgdk/out/MAP01_WORLD_TOOLCHAIN_IMAGE_ID.txt
          chmod -R a+rwX sgdk
          docker run --rm -v "$PWD/sgdk:/m68k" "$ID" | tee sgdk/out/MAP01_WORLD_BUILD_LOG.txt
          test -f sgdk/out/rom.bin
          sha256sum sgdk/out/rom.bin | tee sgdk/out/MAP01_WORLD_ROM_SHA256.txt
          python3 sgdk/tools/verify_rom.py sgdk/out/rom.bin | tee sgdk/out/MAP01_WORLD_ROM_AUDIT.json

      - name: Smoke approved Z01 WORLD_ART in BlastEm
        shell: bash
        run: |
          set -euo pipefail
          OUT="$PWD/sgdk/out/map01_world_smoke"
          HOME_DIR="$RUNNER_TEMP/map01-world-home"
          mkdir -p "$OUT" "$HOME_DIR/.config/blastem"
          CFG_SRC="$(dpkg -L blastem | grep -E '/default\.cfg$' | head -n1 || true)"
          if [ -n "$CFG_SRC" ]; then cp "$CFG_SRC" "$HOME_DIR/.config/blastem/blastem.cfg"; else printf 'ui {\n}\n' > "$HOME_DIR/.config/blastem/blastem.cfg"; fi
          export HOME="$HOME_DIR" DISPLAY=:99 SDL_AUDIODRIVER=dummy LIBGL_ALWAYS_SOFTWARE=1
          Xvfb :99 -screen 0 640x480x24 -nolisten tcp >"$OUT/xvfb.log" 2>&1 & XVFB_PID=$!
          for _ in $(seq 1 50); do xdpyinfo -display :99 >/dev/null 2>&1 && break; sleep .1; done
          xdpyinfo -display :99 >/dev/null
          blastem -g -r U sgdk/out/rom.bin 320 224 >"$OUT/blastem.log" 2>&1 & EMU_PID=$!
          trap 'kill ${EMU_PID:-999999} ${XVFB_PID:-999998} 2>/dev/null || true' EXIT
          WIN=''
          for _ in $(seq 1 80); do WIN="$(xdotool search --pid "$EMU_PID" 2>/dev/null | head -n1 || true)"; [ -n "$WIN" ] && break; kill -0 "$EMU_PID" 2>/dev/null || exit 1; sleep .1; done
          test -n "$WIN"
          xdotool windowfocus "$WIN" 2>/dev/null || true
          shot(){ local label="$1"; import -window "$WIN" "png:$OUT/$label.png"; python3 - "$OUT/$label.png" <<'PY'
          from PIL import Image
          import sys
          im=Image.open(sys.argv[1]); im.verify(); print(sys.argv[1], im.size)
          PY
          }
          tap(){ xdotool keydown --window "$WIN" "$1"; sleep .25; xdotool keyup --window "$WIN" "$1"; sleep 1.5; }
          sleep 4.0
          shot 01_title
          tap Return
          shot 02_menu
          tap Return
          shot 03_battle_start
          xdotool keydown --window "$WIN" Right; sleep 1.2; xdotool keyup --window "$WIN" Right; sleep .6; shot 04_battle_right
          xdotool keydown --window "$WIN" Down; sleep 1.2; xdotool keyup --window "$WIN" Down; sleep .6; shot 05_battle_down
          tap s
          shot 06_menu_return
          kill "$EMU_PID" 2>/dev/null || true; wait "$EMU_PID" 2>/dev/null || true; EMU_PID=''

          rm -rf sgdk/out/runtime_smoke && mkdir -p sgdk/out/runtime_smoke
          python3 - "$OUT" sgdk/out/runtime_smoke <<'PY'
          from pathlib import Path
          from PIL import Image
          import sys
          src=Path(sys.argv[1]); dst=Path(sys.argv[2])
          names=['01_title','02_menu','03_battle_start','04_battle_right','05_battle_down','06_menu_return']
          for name in names:
              im=Image.open(src/f'{name}.png').convert('RGB')
              w,h=im.size
              if (w,h)==(347,243):
                  im=im.crop((13,11,333,235))
              elif (w,h)==(320,224):
                  pass
              elif w>=320 and h>=224:
                  left=(w-320)//2; top=(h-224)//2
                  im=im.crop((left,top,left+320,top+224))
              else:
                  raise SystemExit(f'unsupported capture size {name}: {(w,h)}')
              assert im.size==(320,224),(name,im.size)
              im.save(dst/f'{name}.png')
          print('Map01 WORLD_ART active frame normalization PASS')
          PY

          set +e
          python3 sgdk/tools/analyze_r3_runtime_smoke.py | tee "$OUT/R3_BASE_SMOKE_REPORT.json"
          R3_RC=${PIPESTATUS[0]}
          set -e
          python3 - "$OUT/R3_BASE_SMOKE_REPORT.json" "$OUT/MAP01_WORLD_SMOKE_REPORT.json" "$R3_RC" <<'PY'
          import json,sys
          from pathlib import Path
          from PIL import Image
          import numpy as np
          src,out,base_rc=sys.argv[1],sys.argv[2],int(sys.argv[3])
          report=json.load(open(src,encoding='utf-8')); m=report['metrics']
          cap=np.array(Image.open(Path(out).parent/'03_battle_start.png').convert('RGB'),dtype=np.float32)[:192,:224]
          exp=np.array(Image.open('sgdk/res/map01_z01_runtime_preview.png').convert('RGB'),dtype=np.float32)[212:404,276:500]
          def edges(a):
              g=a.mean(2)
              return np.concatenate(((g[:,1:]-g[:,:-1]).ravel(),(g[1:,:]-g[:-1,:]).ravel()))
          ea,eb=edges(cap),edges(exp)
          edge_corr=float(np.corrcoef(ea,eb)[0,1])
          checks={
            'title_to_menu':m['title_to_menu_full']>=0.08,
            'menu_to_battle':m['menu_to_battle_full']>=0.15,
            'camera_right_moves_field':m['camera_right_field']>=0.08,
            'camera_down_moves_field':m['camera_down_field']>=0.08,
            'hud_fixed_right':m['camera_right_hud_raw']<=0.20,
            'hud_fixed_down':m['camera_down_hud_raw']<=0.20,
            'bottom_fixed_right':m['camera_right_bottom_text_mask']<=0.001,
            'bottom_fixed_down':m['camera_down_bottom_text_mask']<=0.001,
            'return_is_menu_like':m['return_vs_menu_full']<=0.03,
            'return_closer_to_menu_than_battle':m['return_vs_menu_full']<m['return_vs_battle_full'],
            'approved_z01_structure_visible':edge_corr>=0.35,
          }
          result={'status':'PASS' if all(checks.values()) else 'FAIL','base_r3_analyzer_exit_code':base_rc,'metrics':m,'approved_z01_edge_correlation':edge_corr,'checks':checks}
          json.dump(result,open(out,'w',encoding='utf-8'),ensure_ascii=False,indent=2)
          print(json.dumps(result,ensure_ascii=False,indent=2))
          if result['status']!='PASS': raise SystemExit(1)
          PY
          cp sgdk/out/runtime_smoke/*_active.png "$OUT"/ 2>/dev/null || true

      - name: Publish Z01 WORLD_ART candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Modern_Tanks_Map01_Z01_Approved_World_Art_Stream_Candidate
          path: |
            sgdk/out/rom.bin
            sgdk/out/MAP01_WORLD_ROM_SHA256.txt
            sgdk/out/MAP01_WORLD_ROM_AUDIT.json
            sgdk/out/MAP01_WORLD_BUILD_LOG.txt
            sgdk/out/MAP01_WORLD_TOOLCHAIN_IMAGE_ID.txt
            sgdk/out/map01_world_smoke/*
            sgdk/res/map01_z01_runtime_preview.png
            map01/validation/MAP01_Z01_WORLD_STREAM_CONVERSION.json
            map01/validation/MAP01_Z01_WORLD_STREAM_VERIFY.json
          if-no-files-found: warn

name: R2 Targeted Fix SGDK CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'sgdk/**'
      - '.github/workflows/r0-build.yml'

jobs:
  build-r2:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SGDK_IMAGE: registry.gitlab.com/doragasu/docker-sgdk:v2.11

    steps:
      - uses: actions/checkout@v4

      - name: Verify R2 targeted fix
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet Pillow==11.3.0
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          root=Path('sgdk/res')
          src=Path('sgdk/src/main.c').read_text(encoding='utf-8')
          res=Path('sgdk/res/resources.res').read_text(encoding='utf-8')
          assert 'r2_flag_' not in src and 'r2_flag_' not in res
          assert 'flagAnim' not in src
          assert 'apply_enhanced_menu_palette' not in src
          assert 'draw_river_frame' in src and 'draw_fire_frame' in src
          assert 'r2_river_3' in res and 'r2_fire_3' in res

          river=[Image.open(root/f'r2_river_{i}.png') for i in range(4)]
          fire=[Image.open(root/f'r2_fire_{i}.png') for i in range(4)]
          bg=Image.open(root/'r2_menu_bg.png')
          pal=bg.getpalette()
          for im in river+fire:
              im.load(); assert im.mode=='P'; assert im.getpalette()==pal
          for im in river:
              for y in range(68,104):
                  for x in range(56,80):
                      assert (im.getpixel((x,y)) & 15)==0, ('water_on_bridge',x,y)
          f0=fire[0]
          for im in fire[1:]:
              for y in range(22,40):
                  for x in range(32):
                      assert im.getpixel((x,y))==f0.getpixel((x,y)), ('moving_fire_base',x,y)
          def diff(a,b): return sum(x!=y for x,y in zip(a.getdata(),b.getdata()))
          assert min(diff(river[i],river[(i+1)%4]) for i in range(4)) >= 500
          assert min(diff(fire[i],fire[(i+1)%4]) for i in range(4)) >= 30
          print('R2 targeted fix checks PASS')
          PY
          mkdir -p sgdk/out

      - name: Pin SGDK 2.11
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$SGDK_IMAGE"
          ID="$(docker image inspect "$SGDK_IMAGE" --format '{{.Id}}')"
          echo "SGDK_IMAGE_ID=$ID" >> "$GITHUB_ENV"

      - name: Prepare reproducible builds
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/sgdk-r2-a /tmp/sgdk-r2-b
          cp -a sgdk /tmp/sgdk-r2-a
          cp -a sgdk /tmp/sgdk-r2-b
          chmod -R a+rwX /tmp/sgdk-r2-a /tmp/sgdk-r2-b

      - name: Build A
        run: docker run --rm -v /tmp/sgdk-r2-a:/m68k "$SGDK_IMAGE_ID"

      - name: Build B
        run: docker run --rm -v /tmp/sgdk-r2-b:/m68k "$SGDK_IMAGE_ID"

      - name: Reproducibility and ROM audit
        shell: bash
        run: |
          set -euo pipefail
          cmp /tmp/sgdk-r2-a/out/rom.bin /tmp/sgdk-r2-b/out/rom.bin
          cp /tmp/sgdk-r2-a/out/rom.bin sgdk/out/rom.bin
          sha256sum sgdk/out/rom.bin | tee sgdk/out/R2_SHA256.txt
          python3 sgdk/tools/verify_rom.py sgdk/out/rom.bin | tee sgdk/out/R2_ROM_AUDIT.json

      - name: Publish candidate
        uses: actions/upload-artifact@v4
        with:
          name: Modern_Tanks_R2_Targeted_Fix_Candidate
          path: |
            sgdk/out/rom.bin
            sgdk/out/R2_SHA256.txt
            sgdk/out/R2_ROM_AUDIT.json

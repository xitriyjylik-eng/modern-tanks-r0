name: R2 Color-Restore Animated Main Menu SGDK CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'sgdk/**'
      - '.github/workflows/r0-build.yml'

jobs:
  build-r2:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SGDK_IMAGE: registry.gitlab.com/doragasu/docker-sgdk:v2.11

    steps:
      - uses: actions/checkout@v4

      - name: Verify exact R2 color-restored assets
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet Pillow==11.3.0
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          import hashlib

          root=Path('sgdk/res')
          exp={
            'r2_menu_bg.png':('2e8630affb921321a26d0e2f893409cbd23124ac874fda2377cd321a4336cf29',(320,224)),
            'r2_top_right_patch.png':('a065051b471ebaf7d17d2e42ef4a2c1b683117e5fbc25aab9037bbbb2b023bf5',(88,56)),
            'r2_selector.png':('36deb4395d061cc75f9972e0427b2c9b1ccf45ca2eb95992feac49a0737170fd',(144,16)),
            'r2_river_0.png':('9d93723702d78ea580c3c559c11edffcaeec3515bb16e7ed6ee1340f571bbf20',(112,224)),
            'r2_river_1.png':('9e0052f9072cbf53b15fd38c8e21b12b0e8309feabed00c30934ee12bf63be4b',(112,224)),
            'r2_river_2.png':('4f51103ed50e6ab99f7de0880ef2ea208562c039d784c0029ef581f22ba9c277',(112,224)),
            'r2_river_3.png':('b9f92d8506bb5063458ba4ffb472d30cc63a3fb0a6548cc6eb49220fca35c94e',(112,224)),
            'r2_flag_left_0.png':('d3d4d8c3db46e20619c0110b7fb815d2842042dde45cdb187c7511c24f58ca73',(32,32)),
            'r2_flag_left_1.png':('fbd5b6b0fd32bdbd97f8d2579dbde5f0c8d58b2c01464e139efa3845cf96dd86',(32,32)),
            'r2_flag_left_2.png':('baf32b00ffd12a25145d6113f0764ede30efaf33fc6ddeb50d2e921fdbd3a1fd',(32,32)),
            'r2_flag_left_3.png':('c5dd85da1cba88800e509ca1444abb36e11ae131a56945508d0a94e3e0b09994',(32,32)),
            'r2_flag_right_0.png':('2f6a9a853258860770cfc4a471f72dd37707d97e516ff8d14214969430a3d998',(32,40)),
            'r2_flag_right_1.png':('c50bfe758e3b84b69f14f7e44dc8e74d6b5321a234b72435326ec365baae4f47',(32,40)),
            'r2_flag_right_2.png':('048614d47e39dff7f990252b04596fe1873981dd630a99315a9bdc0804a47e4f',(32,40)),
            'r2_flag_right_3.png':('4ab4c18979b1a3ee6600fbabda03bb53e0bd3cce3936b0b1242d96a909169e7e',(32,40)),
            'r2_fire_0.png':('e865e0e5407ccdd475443e90e2f74160b29677baa2e99d5890b45905211ca84b',(32,40)),
            'r2_fire_1.png':('a5d31f299bb0b3c813837e4a8472f8c53a815ce6c25cc224215441e19ac9e0ed',(32,40)),
            'r2_fire_2.png':('c03f4bde76fd1f3ac5d9f83328583e9085cb62921e4f4837ba3a90253f446aa3',(32,40)),
            'r2_fire_3.png':('9426b9aecb01b6320f44634d485ca74eacec96227f20d2c18b28c9c4a2de93dd',(32,40)),
          }

          images={}
          for name,(sha,size) in exp.items():
              p=root/name
              assert p.is_file(), f'missing {name}'
              actual=hashlib.sha256(p.read_bytes()).hexdigest()
              assert actual==sha,(name,actual,sha)
              im=Image.open(p); im.load()
              assert im.mode=='P' and im.size==size,(name,im.mode,im.size)
              images[name]=im

          bg=images['r2_menu_bg.png']; bgpal=bg.getpalette()
          assert images['r2_top_right_patch.png'].getpalette()==bgpal
          assert set(images['r2_selector.png'].getdata()) == {0,15}
          assert 15 not in set(bg.getdata())

          for name,im in images.items():
              if name.startswith(('r2_river_','r2_flag_','r2_fire_')):
                  assert im.getpalette()==bgpal, f'palette drift: {name}'

          for name,im in images.items():
              if name=='r2_selector.png':
                  continue
              for ty in range(0,im.height,8):
                  for tx in range(0,im.width,8):
                      banks={((im.getpixel((x,y))>>4)&3)
                             for y in range(ty,ty+8)
                             for x in range(tx,tx+8)}
                      assert len(banks)==1,(name,tx,ty,banks)

          for prefix in ('r2_flag_left_','r2_flag_right_','r2_fire_'):
              for i in range(4):
                  data=list(images[f'{prefix}{i}.png'].getdata())
                  assert 0 in data
                  visible=[v for v in data if v]
                  assert visible and all((v>>4)==0 for v in visible)

          for i in range(4):
              data=list(images[f'r2_river_{i}.png'].getdata())
              assert 16 in data and all((v>>4)==1 for v in data)

          def diff(a,b):
              return sum(x!=y for x,y in zip(a.getdata(),b.getdata()))

          thresholds={'r2_river_':500,'r2_flag_left_':20,'r2_flag_right_':20,'r2_fire_':50}
          for prefix,minimum in thresholds.items():
              frames=[images[f'{prefix}{i}.png'] for i in range(4)]
              diffs=[diff(frames[i],frames[(i+1)%4]) for i in range(4)]
              assert min(diffs)>=minimum,(prefix,diffs,minimum)
              print(prefix,'frame diffs',diffs)

          print('R2 color-restored animated assets PASS:',len(exp),'PNGs')
          PY
          mkdir -p sgdk/out
          sha256sum sgdk/res/r2_*.png > sgdk/out/R2_RESOURCE_SHA256.txt

      - name: Audit R2 VRAM tile budget
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          root=Path('sgdk/res')
          def uniq(name):
              im=Image.open(root/name); im.load(); s=set()
              for y in range(0,im.height,8):
                  for x in range(0,im.width,8):
                      s.add(bytes(im.crop((x,y,x+8,y+8)).getdata()))
              return len(s)
          bg=uniq('r2_menu_bg.png')
          patch=uniq('r2_top_right_patch.png')
          sel=uniq('r2_selector.png')
          river=max(uniq(f'r2_river_{i}.png') for i in range(4))
          fl=max(uniq(f'r2_flag_left_{i}.png') for i in range(4))
          fr=max(uniq(f'r2_flag_right_{i}.png') for i in range(4))
          fire=max(uniq(f'r2_fire_{i}.png') for i in range(4))
          total=bg+patch+sel+river+fl+fr+fire
          Path('sgdk/out/R2_RESOURCE_BUDGET.md').write_text(f'R2 tile slots: {total}\n',encoding='utf-8')
          print('conservative tile slots',total)
          PY

      - name: Verify R2 source contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('sgdk/src/main.c').read_text(encoding='utf-8')
          res=Path('sgdk/res/resources.res').read_text(encoding='utf-8')
          for token in ('JOY_SUPPORT_3BTN','TILE_USER_MAX_INDEX','R2_ANIM_FRAMES 4',
                        'R2_RIVER_HOLD_TICKS 5','R2_FLAG_HOLD_TICKS 9','R2_FIRE_HOLD_TICKS 4',
                        'draw_river_frame','draw_flag_frames','draw_fire_frame',
                        'r2_top_right_patch','r2_river_3','r2_flag_right_3','r2_fire_3'):
              assert token in src, token
          assert 'apply_enhanced_menu_palette' not in src
          for token in ('IMAGE r2_menu_bg','IMAGE r2_top_right_patch','IMAGE r2_river_3',
                        'IMAGE r2_flag_left_3','IMAGE r2_flag_right_3','IMAGE r2_fire_3'):
              assert token in res, token
          print('R2 color-restored source contract PASS')
          PY

      - name: Pin SGDK 2.11
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$SGDK_IMAGE"
          ID="$(docker image inspect "$SGDK_IMAGE" --format '{{.Id}}')"
          DIGEST="$(docker image inspect "$SGDK_IMAGE" --format '{{index .RepoDigests 0}}')"
          echo "SGDK_IMAGE_ID=$ID" >> "$GITHUB_ENV"
          printf '%s\n' "$ID" > sgdk/out/R2_TOOLCHAIN_IMAGE_ID.txt
          printf '%s\n' "$DIGEST" > sgdk/out/R2_TOOLCHAIN_IMAGE_DIGEST.txt

      - name: Prepare reproducible build trees
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/sgdk-r2-a /tmp/sgdk-r2-b
          cp -a sgdk /tmp/sgdk-r2-a
          cp -a sgdk /tmp/sgdk-r2-b
          chmod -R a+rwX /tmp/sgdk-r2-a /tmp/sgdk-r2-b

      - name: Build A
        run: docker run --rm -v /tmp/sgdk-r2-a:/m68k "$SGDK_IMAGE_ID"

      - name: Build B
        run: docker run --rm -v /tmp/sgdk-r2-b:/m68k "$SGDK_IMAGE_ID"

      - name: Reproducibility and ROM audit
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/sgdk-r2-a/out/rom.bin
          test -f /tmp/sgdk-r2-b/out/rom.bin
          cmp /tmp/sgdk-r2-a/out/rom.bin /tmp/sgdk-r2-b/out/rom.bin
          cp /tmp/sgdk-r2-a/out/rom.bin sgdk/out/rom.bin
          sha256sum sgdk/out/rom.bin | tee sgdk/out/R2_SHA256.txt
          python3 sgdk/tools/verify_rom.py sgdk/out/rom.bin | tee sgdk/out/R2_ROM_AUDIT.json

      - name: Build report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sgdk/out
          ROM_SHA=NOT_BUILT; ROM_SIZE=NOT_BUILT
          if [ -f sgdk/out/rom.bin ]; then ROM_SHA="$(sha256sum sgdk/out/rom.bin|awk '{print $1}')"; ROM_SIZE="$(stat -c '%s' sgdk/out/rom.bin)"; fi
          cat > sgdk/out/R2_BUILD_REPORT.md <<REPORT
          # Modern Tanks R2 — Color-Restored Animated Menu Candidate
          - Commit: ${GITHUB_SHA}
          - SGDK: 2.11 pinned container
          - ROM size: ${ROM_SIZE}
          - ROM SHA-256: ${ROM_SHA}
          - Native presentation: 320x224
          - Russian menu typography/layout: unchanged
          - Top-right minimap: removed
          - Landscape palette: restored to accepted original
          - River: four-frame full-water downward motion
          - Flags: four-frame visible wind motion
          - Fire: transparent four-frame flame, no rectangular backdrop
          - R1 core: preserved
          - R3 gameplay: not started
          - Gate: TARGET PENDING owner emulator acceptance
          REPORT

      - name: Publish R2 color-restored candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Modern_Tanks_R2_Color_Restore_Animated_Candidate
          path: |
            sgdk/out/rom.bin
            sgdk/out/R2_SHA256.txt
            sgdk/out/R2_ROM_AUDIT.json
            sgdk/out/R2_BUILD_REPORT.md
            sgdk/out/R2_RESOURCE_SHA256.txt
            sgdk/out/R2_RESOURCE_BUDGET.md
            sgdk/out/R2_TOOLCHAIN_IMAGE_ID.txt
            sgdk/out/R2_TOOLCHAIN_IMAGE_DIGEST.txt
          if-no-files-found: warn

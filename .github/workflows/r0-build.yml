name: R2 Final Main Menu Visual SGDK CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'sgdk/**'
      - '.github/workflows/r0-build.yml'

jobs:
  build-r2:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      SGDK_IMAGE: registry.gitlab.com/doragasu/docker-sgdk:v2.11

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate native R2 indexed assets
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet Pillow==11.3.0
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          import hashlib

          root = Path('sgdk/res')
          bg_path = root / 'r2_menu_bg.png'
          sel_path = root / 'r2_selector.png'

          expected = {
              bg_path: ('acf9bcd28e0d9d30d7bb205404ad97a0252e15e76db8039a251ed73526eb2e61', (320, 224)),
              sel_path: ('9da097c4fe2af98452d3787f91fd879aab9b468d5daf56a90f1b2d2bc617663f', (144, 16)),
          }

          for path, (sha, size) in expected.items():
              data = path.read_bytes()
              actual = hashlib.sha256(data).hexdigest()
              if actual != sha:
                  raise SystemExit(f'{path}: SHA mismatch {actual} != {sha}')
              im = Image.open(path)
              im.load()
              if im.mode != 'P':
                  raise SystemExit(f'{path}: expected indexed P mode, got {im.mode}')
              if im.size != size:
                  raise SystemExit(f'{path}: size {im.size} != {size}')

          # ResComp 8bpp tile contract:
          # palette-select bits 4-5 must be constant inside every 8x8 tile.
          bg = Image.open(bg_path)
          bg.load()
          bad = []
          palette_use = [0, 0, 0, 0]
          for ty in range(0, bg.height, 8):
              for tx in range(0, bg.width, 8):
                  vals = []
                  for y in range(ty, ty + 8):
                      for x in range(tx, tx + 8):
                          vals.append(bg.getpixel((x, y)))
                  banks = {((v >> 4) & 3) for v in vals}
                  if len(banks) != 1:
                      bad.append((tx, ty, sorted(banks)))
                  else:
                      palette_use[next(iter(banks))] += 1
          if bad:
              raise SystemExit(f'Per-tile palette contract failed: {bad[:8]}')

          sel = Image.open(sel_path)
          sel.load()
          if any(((v >> 4) & 3) != 0 for v in sel.getdata()):
              raise SystemExit('Selector must use PAL0 only')
          if 15 not in set(sel.getdata()):
              raise SystemExit('Selector gold index 15 missing')

          print('R2 native asset validation PASS; palette-tile counts:', palette_use)
          PY

          mkdir -p sgdk/out
          sha256sum sgdk/res/r2_menu_bg.png sgdk/res/r2_selector.png > sgdk/out/R2_RESOURCE_SHA256.txt

      - name: Audit R2 tile usage without arbitrary project ceiling
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path

          def unique_tiles(path):
              im = Image.open(path)
              im.load()
              tiles = set()
              for y in range(0, im.height, 8):
                  for x in range(0, im.width, 8):
                      tile = bytes(im.crop((x, y, x + 8, y + 8)).getdata())
                      tiles.add(tile)
              return len(tiles)

          bg = unique_tiles('sgdk/res/r2_menu_bg.png')
          selector = unique_tiles('sgdk/res/r2_selector.png')
          raw = (bg + selector) * 32

          Path('sgdk/out/R2_RESOURCE_BUDGET.md').write_text(
              '# R2 resource usage — Final Visual Target\n\n'
              f'- Background unique indexed 8x8 tiles before ResComp duplicate/flip optimization: **{bg}**.\n'
              f'- Selector unique indexed tiles: **{selector}**.\n'
              f'- Conservative raw pattern bytes before ResComp savings: **{raw}**.\n'
              '- No artificial 44 KiB project ceiling is applied.\n'
              '- Actual SGDK/VDP available tile space is checked by runtime against TILE_USER_MAX_INDEX.\n'
              '- Background uses per-tile PAL0..PAL3 assignment supported by ResComp 8bpp indexed images.\n'
              '- Lower tank/stat/minimap HUD: removed.\n'
              '- Detached decorative moving tank: removed.\n'
              '- R3 battle renderer remains absent.\n',
              encoding='utf-8')
          print('R2 resource audit', bg, selector, raw)
          PY

      - name: Verify R2 source contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Modern Tanks R2' sgdk/src/main.c
          grep -q 'Final Main Menu Visual Target' sgdk/src/main.c
          grep -q 'r2_menu_bg' sgdk/src/main.c
          grep -q 'r2_selector' sgdk/src/main.c
          grep -q 'TILE_USER_MAX_INDEX' sgdk/src/main.c
          grep -q 'JOY_SUPPORT_3BTN' sgdk/src/main.c
          grep -q 'STATE_TEST_BATTLE' sgdk/src/main.c
          grep -q 'STATE_GARAGE' sgdk/src/main.c
          grep -q 'VDP_setEnable(FALSE)' sgdk/src/main.c
          test -f sgdk/res/resources.res
          grep -q 'IMAGE r2_menu_bg' sgdk/res/resources.res
          grep -q 'IMAGE r2_selector' sgdk/res/resources.res
          ! grep -q 'r2_anim_tank' sgdk/res/resources.res
          ! grep -q 'r2_anim_tank' sgdk/src/main.c
          ! grep -qi 'DEV149\|DEV150\|DEV151\|opcode.emitter' sgdk/src/main.c
          ! find sgdk -type f -iname '*Granada*' -print -quit | grep -q .

      - name: Pin exact container image for this run
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$SGDK_IMAGE"
          IMAGE_ID="$(docker image inspect "$SGDK_IMAGE" --format '{{.Id}}')"
          IMAGE_DIGEST="$(docker image inspect "$SGDK_IMAGE" --format '{{index .RepoDigests 0}}')"
          test -n "$IMAGE_ID"
          test -n "$IMAGE_DIGEST"
          mkdir -p sgdk/out
          printf '%s\n' "$IMAGE_ID" > sgdk/out/R2_TOOLCHAIN_IMAGE_ID.txt
          printf '%s\n' "$IMAGE_DIGEST" > sgdk/out/R2_TOOLCHAIN_IMAGE_DIGEST.txt
          printf 'SGDK_IMAGE_ID=%s\n' "$IMAGE_ID" >> "$GITHUB_ENV"

      - name: Prepare two clean writable build trees
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/sgdk-r2-a /tmp/sgdk-r2-b
          cp -a sgdk /tmp/sgdk-r2-a
          cp -a sgdk /tmp/sgdk-r2-b
          chmod -R a+rwX /tmp/sgdk-r2-a /tmp/sgdk-r2-b

      - name: Build A with pinned SGDK 2.11 image ID
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v /tmp/sgdk-r2-a:/m68k "$SGDK_IMAGE_ID"

      - name: Build B with the exact same image ID
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v /tmp/sgdk-r2-b:/m68k "$SGDK_IMAGE_ID"

      - name: Prove reproducibility
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/sgdk-r2-a/out/rom.bin
          test -f /tmp/sgdk-r2-b/out/rom.bin
          cmp /tmp/sgdk-r2-a/out/rom.bin /tmp/sgdk-r2-b/out/rom.bin
          cp /tmp/sgdk-r2-a/out/rom.bin sgdk/out/rom.bin
          sha256sum sgdk/out/rom.bin | tee sgdk/out/R2_SHA256.txt

      - name: Independent ROM header/checksum audit
        shell: bash
        run: |
          set -euo pipefail
          python3 sgdk/tools/verify_rom.py sgdk/out/rom.bin | tee sgdk/out/R2_ROM_AUDIT.json

      - name: Build R2 stage report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sgdk/out
          ROM_SHA="NOT_BUILT"
          ROM_SIZE="NOT_BUILT"
          if [ -f sgdk/out/rom.bin ]; then
            ROM_SHA="$(sha256sum sgdk/out/rom.bin | awk '{print $1}')"
            ROM_SIZE="$(stat -c '%s' sgdk/out/rom.bin)"
          fi
          cat > sgdk/out/R2_BUILD_REPORT.md <<REPORT
          # Modern Tanks R2 — CI Build Report

          - Stage: R2 Main Menu Visual Target — final approved-style candidate
          - Commit: ${GITHUB_SHA}
          - Toolchain: SGDK 2.11 via ${SGDK_IMAGE}
          - ROM size: ${ROM_SIZE} bytes
          - ROM SHA-256: ${ROM_SHA}
          - Reproducibility: two clean builds compared byte-for-byte before audit
          - Input contract: standard 3-button controller
          - Native presentation: 320x224
          - Menu background: derived directly from the approved battlefield visual language
          - Color method: indexed 8bpp with per-8x8-tile PAL0..PAL3 selection
          - Canonical navigation: ИГРАТЬ / ГАРАЖ / СТАТИСТИКА / НАСТРОЙКИ
          - Removed: lower tank/stat/minimap strip and detached decorative moving menu tank
          - Intentionally absent: R3 battle renderer/HUD, world map streaming, gameplay/AI, SRAM, audio
          - Granada assets/code embedded: NO
          - Old DEV code embedded: NO
          - Gate status: TARGET PENDING
          REPORT

      - name: Publish R2 ROM artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Modern_Tanks_R2_Final_Visual_Target
          path: |
            sgdk/out/rom.bin
            sgdk/out/R2_SHA256.txt
            sgdk/out/R2_ROM_AUDIT.json
            sgdk/out/R2_TOOLCHAIN_IMAGE_ID.txt
            sgdk/out/R2_TOOLCHAIN_IMAGE_DIGEST.txt
            sgdk/out/R2_BUILD_REPORT.md
            sgdk/out/R2_RESOURCE_BUDGET.md
            sgdk/out/R2_RESOURCE_SHA256.txt
          if-no-files-found: warn

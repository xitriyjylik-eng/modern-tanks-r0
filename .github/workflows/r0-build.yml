name: R2 Main Menu Visual SGDK CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'sgdk/**'
      - '.github/workflows/r0-build.yml'

jobs:
  build-r2:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      SGDK_IMAGE: registry.gitlab.com/doragasu/docker-sgdk:v2.11

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate native-resolution R2 art
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet Pillow==11.3.0
          python3 sgdk/tools/generate_r2_art.py
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          required = {
              'r2_menu_bg.png': (320, 224),
              'r2_sel_0.png': (104, 16),
              'r2_sel_1.png': (104, 16),
              'r2_sel_2.png': (104, 16),
              'r2_sel_3.png': (104, 16),
          }
          for name, size in required.items():
              p = Path('sgdk/res') / name
              im = Image.open(p)
              im.load()
              assert im.mode == 'P', (name, im.mode)
              assert im.size == size, (name, im.size)
          print('R2 generated art validation PASS')
          PY
          mkdir -p sgdk/out
          sha256sum sgdk/res/r2_menu_bg.png sgdk/res/r2_sel_0.png sgdk/res/r2_sel_1.png sgdk/res/r2_sel_2.png sgdk/res/r2_sel_3.png > sgdk/out/R2_RESOURCE_SHA256.txt

          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path

          def unique_tiles(path):
              im = Image.open(path)
              im.load()
              tiles=set()
              for y in range(0, im.height, 8):
                  for x in range(0, im.width, 8):
                      tile=bytes(im.crop((x,y,min(x+8,im.width),min(y+8,im.height))).getdata())
                      tiles.add(tile)
              return len(tiles)

          bg=unique_tiles('sgdk/res/r2_menu_bg.png')
          sels=[unique_tiles(f'sgdk/res/r2_sel_{i}.png') for i in range(4)]
          worst=bg+max(sels)
          raw=worst*32
          ceiling=44*1024
          free=ceiling-raw
          Path('sgdk/out/R2_RESOURCE_BUDGET.md').write_text(
              '# R2 resource budget — Focused Menu Rework\n\n'
              f'- Background unique 8x8 tiles before ResComp optimization: **{bg}**.\n'
              f'- Selector unique tiles: **{sels}**; only one selector image is resident at a time.\n'
              f'- Conservative simultaneous project-pattern upper bound: **{worst} tiles / {raw} bytes**.\n'
              f'- Against the project 44 KiB pattern ceiling: **{free} bytes free** before ResComp duplicate/flip savings.\n'
              '- Decorative moving-tank overlay: **removed**.\n'
              '- Lower tank/stat/minimap HUD: **removed**; lower screen is continuous static battlefield.\n'
              '- Runtime recurring visual update: selector pulse/navigation only.\n'
              '- Locked reference PNGs are not embedded or modified.\n',
              encoding='utf-8')
          if raw > ceiling:
              raise SystemExit(f'R2 project pattern budget exceeded: {raw}>{ceiling}')
          print('R2 resource budget PASS', bg, sels, raw, free)
          PY

      - name: Verify R2 source and locked-art contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Modern Tanks R2' sgdk/src/main.c
          grep -q 'Focused Menu Rework' sgdk/src/main.c
          grep -q 'r2_menu_bg' sgdk/src/main.c
          grep -q 'JOY_SUPPORT_3BTN' sgdk/src/main.c
          grep -q 'STATE_TEST_BATTLE' sgdk/src/main.c
          grep -q 'STATE_GARAGE' sgdk/src/main.c
          grep -q 'VDP_setEnable(FALSE)' sgdk/src/main.c
          test -f sgdk/res/resources.res
          grep -q 'IMAGE r2_menu_bg' sgdk/res/resources.res
          ! grep -q 'r2_anim_tank' sgdk/res/resources.res
          ! grep -q 'r2_anim_tank' sgdk/src/main.c
          ! grep -qi 'DEV149\|DEV150\|DEV151\|opcode.emitter' sgdk/src/main.c
          ! find sgdk -type f -iname '*MAIN_MENU_REFERENCE*' -print -quit | grep -q .
          ! find sgdk -type f -iname '*TANKS_DETAILED_REFERENCE*' -print -quit | grep -q .
          ! find sgdk -type f -iname '*Granada*' -print -quit | grep -q .

      - name: Pin exact container image for this run
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$SGDK_IMAGE"
          IMAGE_ID="$(docker image inspect "$SGDK_IMAGE" --format '{{.Id}}')"
          IMAGE_DIGEST="$(docker image inspect "$SGDK_IMAGE" --format '{{index .RepoDigests 0}}')"
          test -n "$IMAGE_ID"
          test -n "$IMAGE_DIGEST"
          mkdir -p sgdk/out
          printf '%s\n' "$IMAGE_ID" > sgdk/out/R2_TOOLCHAIN_IMAGE_ID.txt
          printf '%s\n' "$IMAGE_DIGEST" > sgdk/out/R2_TOOLCHAIN_IMAGE_DIGEST.txt
          printf 'SGDK_IMAGE_ID=%s\n' "$IMAGE_ID" >> "$GITHUB_ENV"

      - name: Prepare two clean writable build trees
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/sgdk-r2-a /tmp/sgdk-r2-b
          cp -a sgdk /tmp/sgdk-r2-a
          cp -a sgdk /tmp/sgdk-r2-b
          chmod -R a+rwX /tmp/sgdk-r2-a /tmp/sgdk-r2-b

      - name: Build A with pinned SGDK 2.11 image ID
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v /tmp/sgdk-r2-a:/m68k "$SGDK_IMAGE_ID"

      - name: Build B with the exact same image ID
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v /tmp/sgdk-r2-b:/m68k "$SGDK_IMAGE_ID"

      - name: Prove reproducibility
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/sgdk-r2-a/out/rom.bin
          test -f /tmp/sgdk-r2-b/out/rom.bin
          cmp /tmp/sgdk-r2-a/out/rom.bin /tmp/sgdk-r2-b/out/rom.bin
          cp /tmp/sgdk-r2-a/out/rom.bin sgdk/out/rom.bin
          sha256sum sgdk/out/rom.bin | tee sgdk/out/R2_SHA256.txt

      - name: Independent ROM header/checksum audit
        shell: bash
        run: |
          set -euo pipefail
          python3 sgdk/tools/verify_rom.py sgdk/out/rom.bin | tee sgdk/out/R2_ROM_AUDIT.json

      - name: Build R2 stage report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sgdk/out
          ROM_SHA="NOT_BUILT"
          ROM_SIZE="NOT_BUILT"
          if [ -f sgdk/out/rom.bin ]; then
            ROM_SHA="$(sha256sum sgdk/out/rom.bin | awk '{print $1}')"
            ROM_SIZE="$(stat -c '%s' sgdk/out/rom.bin)"
          fi
          cat > sgdk/out/R2_BUILD_REPORT.md <<REPORT
          # Modern Tanks R2 — CI Build Report

          - Stage: R2 Main Menu Visual Target — Focused Menu / Tank Reference Rework
          - Commit: ${GITHUB_SHA}
          - Toolchain: SGDK 2.11 via ${SGDK_IMAGE}
          - ROM size: ${ROM_SIZE} bytes
          - ROM SHA-256: ${ROM_SHA}
          - Reproducibility: two clean builds compared byte-for-byte before audit
          - Input contract: standard 3-button controller
          - Included: accepted R1 core, native 320x224 menu, full-screen battlefield, hand-drawn reference-driven T-1/T-2/T-3/T-4 silhouettes, metallic logo, four canonical Russian menu items, animated selector pulse
          - Removed by owner direction: lower tank-class/stat/minimap strip and decorative moving menu tank
          - Canonical navigation: ИГРАТЬ / ГАРАЖ / СТАТИСТИКА / НАСТРОЙКИ; tank/class selection belongs to GARAGE; map/mission context belongs outside the main menu
          - Intentionally absent: R3 battle renderer/HUD, R4 final combat tank sprite set, world map streaming, gameplay/AI, SRAM, audio
          - Locked reference PNG embedded/modified: NO
          - Granada assets/code embedded: NO
          - Project VDP sprite payload in menu: 0
          - Runtime recurring visual update: selector pulse/navigation only
          - Menu bank cleanup: inherited accepted R1 blanked teardown with plane/CRAM/sprite residue checks
          - Emulator status: CI PASS does not replace MD Emu Games Gen target visual acceptance
          - Gate status: TARGET PENDING
          REPORT

      - name: Publish R2 ROM artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Modern_Tanks_R2_Focused_Menu_Tank_Rework
          path: |
            sgdk/out/rom.bin
            sgdk/out/R2_SHA256.txt
            sgdk/out/R2_ROM_AUDIT.json
            sgdk/out/R2_TOOLCHAIN_IMAGE_ID.txt
            sgdk/out/R2_TOOLCHAIN_IMAGE_DIGEST.txt
            sgdk/out/R2_BUILD_REPORT.md
            sgdk/out/R2_RESOURCE_BUDGET.md
            sgdk/out/R2_RESOURCE_SHA256.txt
          if-no-files-found: warn

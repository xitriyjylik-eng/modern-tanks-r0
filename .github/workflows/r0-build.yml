name: R2 Final Main Menu Visual SGDK CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'sgdk/**'
      - '.github/workflows/r0-build.yml'

jobs:
  build-r2:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SGDK_IMAGE: registry.gitlab.com/doragasu/docker-sgdk:v2.11
    steps:
      - uses: actions/checkout@v4

      - name: Restore exact approved R2 assets
        shell: bash
        run: |
          set -euo pipefail
          python3 sgdk/tools/restore_r2_assets.py
          python3 -m pip install --disable-pip-version-check --quiet Pillow==11.3.0
          python3 - <<'PY'
          from PIL import Image
          import hashlib
          from pathlib import Path
          exp={
            'r2_menu_bg.png':('5ec08a6cb60201367bc45becdf116f3efe71597762f5f25d7aa28b62ff6426ea',(320,224)),
            'r2_selector.png':('36deb4395d061cc75f9972e0427b2c9b1ccf45ca2eb95992feac49a0737170fd',(144,16)),
          }
          root=Path('sgdk/res')
          for name,(sha,size) in exp.items():
            p=root/name; data=p.read_bytes()
            assert hashlib.sha256(data).hexdigest()==sha
            im=Image.open(p); im.load()
            assert im.mode=='P' and im.size==size, (name,im.mode,im.size)
          bg=Image.open(root/'r2_menu_bg.png'); bg.load()
          use=[0,0,0,0]
          for ty in range(0,224,8):
            for tx in range(0,320,8):
              banks={((bg.getpixel((x,y))>>4)&3) for y in range(ty,ty+8) for x in range(tx,tx+8)}
              assert len(banks)==1,(tx,ty,banks)
              use[next(iter(banks))]+=1
          sel=Image.open(root/'r2_selector.png'); sel.load()
          assert all(((v>>4)&3)==0 for v in sel.getdata())
          assert 15 in set(sel.getdata())
          print('R2 exact graphics PASS; palette tile use',use)
          PY
          mkdir -p sgdk/out
          sha256sum sgdk/res/r2_menu_bg.png sgdk/res/r2_selector.png > sgdk/out/R2_RESOURCE_SHA256.txt

      - name: Audit tile use
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          def uniq(path):
            im=Image.open(path); im.load(); s=set()
            for y in range(0,im.height,8):
              for x in range(0,im.width,8):
                s.add(bytes(im.crop((x,y,x+8,y+8)).getdata()))
            return len(s)
          bg=uniq('sgdk/res/r2_menu_bg.png')
          sel=uniq('sgdk/res/r2_selector.png')
          Path('sgdk/out/R2_RESOURCE_BUDGET.md').write_text(
            f'# R2 exact graphics audit\n\n- Background unique 8x8 indexed tiles: **{bg}**.\n- Selector unique tiles: **{sel}**.\n- Raw patterns before ResComp duplicate/flip savings: **{(bg+sel)*32} bytes**.\n- Artificial project graphics ceiling: **none**.\n- Runtime guards actual SGDK TILE_USER_MAX_INDEX.\n',encoding='utf-8')
          print('tiles',bg,sel)
          PY

      - name: Verify R2 source contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'R2 Final Main Menu Visual Target' sgdk/src/main.c
          grep -q 'JOY_SUPPORT_3BTN' sgdk/src/main.c
          grep -q 'TILE_USER_MAX_INDEX' sgdk/src/main.c
          grep -q 'IMAGE r2_menu_bg' sgdk/res/resources.res
          grep -q 'IMAGE r2_selector' sgdk/res/resources.res
          ! grep -qi 'DEV149\|DEV150\|DEV151\|opcode.emitter' sgdk/src/main.c
          ! find sgdk -type f -iname '*Granada*' -print -quit | grep -q .

      - name: Pin SGDK 2.11
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$SGDK_IMAGE"
          ID="$(docker image inspect "$SGDK_IMAGE" --format '{{.Id}}')"
          DIGEST="$(docker image inspect "$SGDK_IMAGE" --format '{{index .RepoDigests 0}}')"
          echo "SGDK_IMAGE_ID=$ID" >> "$GITHUB_ENV"
          printf '%s\n' "$ID" > sgdk/out/R2_TOOLCHAIN_IMAGE_ID.txt
          printf '%s\n' "$DIGEST" > sgdk/out/R2_TOOLCHAIN_IMAGE_DIGEST.txt

      - name: Prepare reproducible build trees
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/sgdk-r2-a /tmp/sgdk-r2-b
          cp -a sgdk /tmp/sgdk-r2-a
          cp -a sgdk /tmp/sgdk-r2-b
          chmod -R a+rwX /tmp/sgdk-r2-a /tmp/sgdk-r2-b

      - name: Build A
        run: docker run --rm -v /tmp/sgdk-r2-a:/m68k "$SGDK_IMAGE_ID"
      - name: Build B
        run: docker run --rm -v /tmp/sgdk-r2-b:/m68k "$SGDK_IMAGE_ID"

      - name: Reproducibility and ROM audit
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/sgdk-r2-a/out/rom.bin
          test -f /tmp/sgdk-r2-b/out/rom.bin
          cmp /tmp/sgdk-r2-a/out/rom.bin /tmp/sgdk-r2-b/out/rom.bin
          cp /tmp/sgdk-r2-a/out/rom.bin sgdk/out/rom.bin
          sha256sum sgdk/out/rom.bin | tee sgdk/out/R2_SHA256.txt
          python3 sgdk/tools/verify_rom.py sgdk/out/rom.bin | tee sgdk/out/R2_ROM_AUDIT.json

      - name: Build report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sgdk/out
          ROM_SHA=NOT_BUILT; ROM_SIZE=NOT_BUILT
          if [ -f sgdk/out/rom.bin ]; then ROM_SHA="$(sha256sum sgdk/out/rom.bin|awk '{print $1}')"; ROM_SIZE="$(stat -c '%s' sgdk/out/rom.bin)"; fi
          cat > sgdk/out/R2_BUILD_REPORT.md <<REPORT
          # Modern Tanks R2 — Final Visual Candidate
          - Commit: ${GITHUB_SHA}
          - SGDK: 2.11 pinned container
          - ROM size: ${ROM_SIZE}
          - ROM SHA-256: ${ROM_SHA}
          - Native presentation: 320x224
          - Graphics: exact approved-style indexed R2 asset, PAL0..PAL3 per 8x8 tile
          - Menu: ИГРАТЬ / ГАРАЖ / СТАТИСТИКА / НАСТРОЙКИ
          - Lower tank/stat/minimap strip: removed
          - Decorative moving tank: removed
          - R1 core: preserved
          - R3 gameplay: not started
          - Granada / old DEV assets: not embedded
          - Gate: TARGET PENDING owner emulator acceptance
          REPORT

      - name: Publish R2 candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Modern_Tanks_R2_Final_Visual_Candidate
          path: |
            sgdk/out/rom.bin
            sgdk/res/r2_menu_bg.png
            sgdk/out/R2_SHA256.txt
            sgdk/out/R2_ROM_AUDIT.json
            sgdk/out/R2_BUILD_REPORT.md
            sgdk/out/R2_RESOURCE_BUDGET.md
            sgdk/out/R2_RESOURCE_SHA256.txt
            sgdk/out/R2_TOOLCHAIN_IMAGE_ID.txt
            sgdk/out/R2_TOOLCHAIN_IMAGE_DIGEST.txt
          if-no-files-found: warn

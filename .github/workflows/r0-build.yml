name: R2 Refined Embedded Ambient SGDK CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'sgdk/**'
      - '.github/workflows/r0-build.yml'

jobs:
  build-r2:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SGDK_IMAGE: registry.gitlab.com/doragasu/docker-sgdk:v2.11

    steps:
      - uses: actions/checkout@v4

      - name: Verify R2 refined embedded animation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet Pillow==11.3.0 numpy==2.1.3
          python3 sgdk/tools/generate_r2_anim_header.py
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          src=Path('sgdk/src/main.c').read_text(encoding='utf-8')
          hdr=Path('sgdk/src/r2_anim_assets.h').read_text(encoding='utf-8')
          res=Path('sgdk/res/resources.res').read_text(encoding='utf-8')
          assert 'r2_flag_left_' not in src and 'r2_flag_left_' not in hdr and 'r2_flag_left_' not in res
          assert 'r2_flag_right_base_patch' not in res
          assert 'r2_river_' not in res and 'r2_fire_' not in res and 'r2_flag_' not in res
          assert '#define R2_RIVER_HOLD_TICKS 10' in src
          for token in ('R2_RIVER_TILE_COUNT','R2_FLAG_TILE_COUNT','R2_FIRE_UPPER_TILE_COUNT','R2_FIRE_LOWER_TILE_COUNT'):
              assert token in hdr and token in src
          assert 'VDP_setTileMapXY' in src and 'VDP_loadTileData' in src
          assert hashlib.sha256(Path('sgdk/src/r2_anim_assets.h').read_bytes()).hexdigest()=='cd6b53cf8d534995ef0626a8052374d031363a437da8317335d4fed441b8dd2d'
          print('R2 embedded animation checks PASS')
          PY
          mkdir -p sgdk/out

      - name: Pin SGDK 2.11
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$SGDK_IMAGE"
          ID="$(docker image inspect "$SGDK_IMAGE" --format '{{.Id}}')"
          echo "SGDK_IMAGE_ID=$ID" >> "$GITHUB_ENV"

      - name: Prepare reproducible builds
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/sgdk-r2-a /tmp/sgdk-r2-b
          cp -a sgdk /tmp/sgdk-r2-a
          cp -a sgdk /tmp/sgdk-r2-b
          chmod -R a+rwX /tmp/sgdk-r2-a /tmp/sgdk-r2-b

      - name: Build A
        run: docker run --rm -v /tmp/sgdk-r2-a:/m68k "$SGDK_IMAGE_ID"

      - name: Build B
        run: docker run --rm -v /tmp/sgdk-r2-b:/m68k "$SGDK_IMAGE_ID"

      - name: Reproducibility and ROM audit
        shell: bash
        run: |
          set -euo pipefail
          cmp /tmp/sgdk-r2-a/out/rom.bin /tmp/sgdk-r2-b/out/rom.bin
          cp /tmp/sgdk-r2-a/out/rom.bin sgdk/out/rom.bin
          sha256sum sgdk/out/rom.bin | tee sgdk/out/R2_SHA256.txt
          python3 sgdk/tools/verify_rom.py sgdk/out/rom.bin | tee sgdk/out/R2_ROM_AUDIT.json

      - name: Publish candidate
        uses: actions/upload-artifact@v4
        with:
          name: Modern_Tanks_R2_Refined_Embedded_Candidate
          path: |
            sgdk/out/rom.bin
            sgdk/out/R2_SHA256.txt
            sgdk/out/R2_ROM_AUDIT.json

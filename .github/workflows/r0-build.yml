name: R2 River-Course Flag Fire Trees SGDK CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'sgdk/**'
      - '.github/workflows/r0-build.yml'

jobs:
  build-r2:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SGDK_IMAGE: registry.gitlab.com/doragasu/docker-sgdk:v2.11

    steps:
      - uses: actions/checkout@v4

      - name: Generate final R2 ambient assets
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet Pillow==11.3.0 numpy==2.3.3 scipy==1.16.2
          python3 sgdk/tools/build_refined_animation_assets.py

      - name: Verify final R2 ambient assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib, json

          root=Path('sgdk/res')
          bg=Image.open(root/'r2_menu_bg.png'); bg.load()
          sel=Image.open(root/'r2_selector.png'); sel.load()
          assert bg.mode=='P' and bg.size==(320,224)
          assert sel.mode=='P' and sel.size==(144,16)
          palette=bg.getpalette()
          assert hashlib.sha256(bytes(palette)).hexdigest()=='b21fe2dc53ee77cefd085d08f3251cb64627a41f688602daf394f1915ddffc37'
          assert hashlib.sha256((root/'r2_menu_bg.png').read_bytes()).hexdigest()=='2f1e69a776957bae113d1eb24df9564c99855459f8d661a656291775730917ff'
          assert hashlib.sha256((root/'r2_selector.png').read_bytes()).hexdigest()=='36deb4395d061cc75f9972e0427b2c9b1ccf45ca2eb95992feac49a0737170fd'

          river=[Image.open(root/f'r2_river_{i}.png') for i in range(12)]
          flag=[Image.open(root/f'r2_flag_right_{i}.png') for i in range(12)]
          top=[Image.open(root/f'r2_fire_top_{i}.png') for i in range(8)]
          bottom=[Image.open(root/f'r2_fire_bottom_{i}.png') for i in range(8)]
          trees=[Image.open(root/f'r2_trees_{i}.png') for i in range(12)]
          for im in river+flag+top+bottom+trees: im.load(); assert im.mode=='P'
          assert all(im.size==(112,224) for im in river)
          assert all(im.size==(32,40) for im in flag)
          assert all(im.size==(40,48) for im in top)
          assert all(im.size==(40,40) for im in bottom)
          assert all(im.size==(48,48) for im in trees)

          assert all(max(im.getdata())<=6 for im in river)
          assert all(max(im.getdata())<=15 for im in flag)
          assert all(max(im.getdata())<=12 for im in top+bottom)
          assert all(max(im.getdata())<=15 for im in trees)
          assert all(0 in set(im.getdata()) for im in river+flag+top+bottom+trees)

          for fi,im in enumerate(river):
              data=list(im.getdata())
              for y in range(224):
                  for x in range(112):
                      v=data[y*112+x]
                      if not v: continue
                      assert x<80, ('river_outside_course',fi,x,y)
              for y in range(63,109):
                  for x in range(49,80):
                      assert data[y*112+x]==0, ('river_on_bridge_or_bank',fi,x,y)

          def diff(a,b): return sum(x!=y for x,y in zip(a.getdata(),b.getdata()))
          rd=[diff(river[i],river[(i+1)%12]) for i in range(12)]
          fd=[diff(flag[i],flag[(i+1)%12]) for i in range(12)]
          td=[diff(trees[i],trees[(i+1)%12]) for i in range(12)]
          assert min(rd)>35,rd
          assert min(fd)>4,fd
          assert len({bytes(im.getdata()) for im in trees})>=6,td
          assert max(td)>100,td

          report=json.loads((root/'R2_REFINED_ANIM_REPORT.json').read_text(encoding='utf-8'))
          assert report['flag_static_removed_pixels']>90
          assert report['upper_warm_after'] < report['upper_warm_before']*0.75
          assert report['lower_warm_after'] < report['lower_warm_before']*0.75
          assert report['tree_static_removed_pixels']>=25
          print('R2 final ambient checks PASS')
          print(json.dumps(report,indent=2))
          PY
          mkdir -p sgdk/out
          sha256sum sgdk/res/r2_menu_bg.png sgdk/res/r2_selector.png \
            sgdk/res/r2_river_*.png sgdk/res/r2_flag_right_*.png \
            sgdk/res/r2_fire_top_*.png sgdk/res/r2_fire_bottom_*.png \
            sgdk/res/r2_trees_*.png > sgdk/out/R2_RESOURCE_SHA256.txt
          cp sgdk/res/R2_REFINED_ANIM_REPORT.json sgdk/out/

      - name: Verify source contract and VRAM budget
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          src=Path('sgdk/src/main.c').read_text(encoding='utf-8')
          res=Path('sgdk/res/resources.res').read_text(encoding='utf-8')
          for token in (
              'R2_RIVER_FRAMES 12','R2_FLAG_FRAMES 12','R2_FIRE_FRAMES 8','R2_TREE_FRAMES 12',
              'R2_RIVER_HOLD_TICKS 6','R2_FLAG_HOLD_TICKS 6','R2_TREE_HOLD_TICKS 10',
              'draw_river_frame','draw_flag_right_frame','draw_fire_top_frame','draw_fire_bottom_frame','draw_trees_frame',
              'TILE_ATTR_FULL(PAL1','TILE_ATTR_FULL(PAL2','TILE_ATTR_FULL(PAL3',
              'r2_river_11','r2_flag_right_11','r2_trees_11','TILE_USER_MAX_INDEX','JOY_SUPPORT_3BTN'):
              assert token in src,token
          assert 'r2_flag_left_' not in src and 'r2_flag_left_' not in res
          assert 'apply_enhanced_menu_palette' not in src
          for prefix,count in (('r2_river_',12),('r2_flag_right_',12),('r2_fire_top_',8),('r2_fire_bottom_',8),('r2_trees_',12)):
              for i in range(count): assert f'IMAGE {prefix}{i}' in res,(prefix,i)

          root=Path('sgdk/res')
          def uniq(name):
              im=Image.open(root/name); im.load(); s=set()
              for y in range(0,im.height,8):
                  for x in range(0,im.width,8):
                      s.add(bytes(im.crop((x,y,min(x+8,im.width),min(y+8,im.height))).getdata()))
              return len(s)
          bg=uniq('r2_menu_bg.png'); patch=uniq('r2_top_right_patch.png'); sel=uniq('r2_selector.png')
          river=max(uniq(f'r2_river_{i}.png') for i in range(12))
          flag=max(uniq(f'r2_flag_right_{i}.png') for i in range(12))
          top=max(uniq(f'r2_fire_top_{i}.png') for i in range(8))
          bottom=max(uniq(f'r2_fire_bottom_{i}.png') for i in range(8))
          trees=max(uniq(f'r2_trees_{i}.png') for i in range(12))
          total=bg+patch+sel+river+flag+top+bottom+trees
          Path('sgdk/out/R2_RESOURCE_BUDGET.md').write_text(
              f'background={bg}\npatch={patch}\nselector={sel}\nriver={river}\nflag={flag}\nfire_top={top}\nfire_bottom={bottom}\ntrees={trees}\nconservative_total={total}\n',encoding='utf-8')
          print('conservative unique tile slots',total)
          assert total<1500,total
          PY

      - name: Pin SGDK 2.11
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$SGDK_IMAGE"
          ID="$(docker image inspect "$SGDK_IMAGE" --format '{{.Id}}')"
          DIGEST="$(docker image inspect "$SGDK_IMAGE" --format '{{index .RepoDigests 0}}')"
          echo "SGDK_IMAGE_ID=$ID" >> "$GITHUB_ENV"
          printf '%s\n' "$ID" > sgdk/out/R2_TOOLCHAIN_IMAGE_ID.txt
          printf '%s\n' "$DIGEST" > sgdk/out/R2_TOOLCHAIN_IMAGE_DIGEST.txt

      - name: Prepare reproducible builds
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/sgdk-r2-a /tmp/sgdk-r2-b
          cp -a sgdk /tmp/sgdk-r2-a
          cp -a sgdk /tmp/sgdk-r2-b
          chmod -R a+rwX /tmp/sgdk-r2-a /tmp/sgdk-r2-b

      - name: Build A
        run: docker run --rm -v /tmp/sgdk-r2-a:/m68k "$SGDK_IMAGE_ID"

      - name: Build B
        run: docker run --rm -v /tmp/sgdk-r2-b:/m68k "$SGDK_IMAGE_ID"

      - name: Reproducibility and ROM audit
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/sgdk-r2-a/out/rom.bin
          test -f /tmp/sgdk-r2-b/out/rom.bin
          cmp /tmp/sgdk-r2-a/out/rom.bin /tmp/sgdk-r2-b/out/rom.bin
          cp /tmp/sgdk-r2-a/out/rom.bin sgdk/out/rom.bin
          sha256sum sgdk/out/rom.bin | tee sgdk/out/R2_SHA256.txt
          python3 sgdk/tools/verify_rom.py sgdk/out/rom.bin | tee sgdk/out/R2_ROM_AUDIT.json

      - name: Build report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sgdk/out
          ROM_SHA=NOT_BUILT; ROM_SIZE=NOT_BUILT
          if [ -f sgdk/out/rom.bin ]; then ROM_SHA="$(sha256sum sgdk/out/rom.bin|awk '{print $1}')"; ROM_SIZE="$(stat -c '%s' sgdk/out/rom.bin)"; fi
          cat > sgdk/out/R2_BUILD_REPORT.md <<REPORT
          # Modern Tanks R2 — River Course / Flag / Fire / Trees Candidate
          - Commit: ${GITHUB_SHA}
          - SGDK: 2.11 pinned
          - ROM size: ${ROM_SIZE}
          - ROM SHA-256: ${ROM_SHA}
          - Menu/typography/layout: unchanged
          - Landscape palette: unchanged
          - River: 12-frame slow flow following local river tangent; bridge and shore excluded
          - Right flag: original cloth/emblem, 12 smooth warped frames on existing pole
          - Left flag: absent
          - Upper fire: static warm core removed; 8-frame irregular multi-tongue fire
          - Lower fire: static warm core removed; 8-frame irregular multi-tongue fire
          - Trees: subtle 12-frame one-pixel foliage motion in existing PAL2 greens
          - R1 core: preserved
          - Gate: TARGET PENDING owner emulator acceptance
          REPORT

      - name: Publish final ambient candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Modern_Tanks_R2_River_Flag_Fire_Trees_Candidate
          path: |
            sgdk/out/rom.bin
            sgdk/out/R2_SHA256.txt
            sgdk/out/R2_ROM_AUDIT.json
            sgdk/out/R2_BUILD_REPORT.md
            sgdk/out/R2_RESOURCE_SHA256.txt
            sgdk/out/R2_RESOURCE_BUDGET.md
            sgdk/out/R2_REFINED_ANIM_REPORT.json
            sgdk/out/R2_TOOLCHAIN_IMAGE_ID.txt
            sgdk/out/R2_TOOLCHAIN_IMAGE_DIGEST.txt
          if-no-files-found: warn

name: R2 Full Accepted Project Backup

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/r2-full-backup.yml'

jobs:
  full-backup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ACCEPTED_R2_COMMIT: a1faa7d567ceb7f5506005b354da28f5c1ea0cee
      ACCEPTED_R2_ROM_SHA256: fb6896471a1bf559e13c55118c3d2beedf8c1567ff6703a114ef05857b744017
      SGDK_IMAGE: registry.gitlab.com/doragasu/docker-sgdk:v2.11
      PACKAGE_NAME: Modern_Tanks_FULL_PROJECT_R2_ACCEPTED_2026-09-09

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify accepted gameplay source is unchanged
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${ACCEPTED_R2_COMMIT}^{commit}"
          git diff --exit-code "$ACCEPTED_R2_COMMIT" HEAD -- sgdk
          echo "Accepted R2 SGDK source matches baseline ${ACCEPTED_R2_COMMIT}"

      - name: Capture source snapshot before generated resource pass
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="/tmp/${PACKAGE_NAME}"
          rm -rf "$PACKAGE"
          mkdir -p "$PACKAGE/PROJECT_SOURCE" "$PACKAGE/STATUS" "$PACKAGE/ACCEPTED_R2_GENERATED_RESOURCES" "$PACKAGE/ACCEPTED_R2_BUILD"
          rsync -a --exclude='.git' --exclude='sgdk/out' ./ "$PACKAGE/PROJECT_SOURCE/"
          cp 00_CURRENT_STATUS_READ_FIRST.md "$PACKAGE/STATUS/"
          cp README_RU.md "$PACKAGE/STATUS/"
          cp SESSION_HANDOFF_CURRENT.md "$PACKAGE/STATUS/"
          cp WHAT_DONE_WHAT_LEFT.md "$PACKAGE/STATUS/"
          cp R2_ACCEPTANCE_FINAL.md "$PACKAGE/STATUS/"
          cp BACKUP_CONTENTS.md "$PACKAGE/STATUS/"
          cp plan/PROJECT_PROGRESS_ACCEPTED_R2.md "$PACKAGE/STATUS/"
          cp plan/NEXT_R3_SCOPE.md "$PACKAGE/STATUS/"
          printf '%s\n' "$ACCEPTED_R2_COMMIT" > "$PACKAGE/ACCEPTED_R2_BASELINE_COMMIT.txt"
          printf '%s\n' "$GITHUB_SHA" > "$PACKAGE/BACKUP_DOCUMENTATION_COMMIT.txt"

      - name: Generate and verify accepted R2 resources
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet Pillow==11.3.0 numpy==2.3.3 scipy==1.16.2
          python3 sgdk/tools/build_refined_animation_assets.py
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib, json
          root=Path('sgdk/res')
          bg=Image.open(root/'r2_menu_bg.png'); bg.load()
          assert bg.mode=='P' and bg.size==(320,224)
          assert hashlib.sha256((root/'r2_menu_bg.png').read_bytes()).hexdigest()=='2f1e69a776957bae113d1eb24df9564c99855459f8d661a656291775730917ff'
          assert hashlib.sha256((root/'r2_selector.png').read_bytes()).hexdigest()=='36deb4395d061cc75f9972e0427b2c9b1ccf45ca2eb95992feac49a0737170fd'
          river=[Image.open(root/f'r2_river_{i}.png') for i in range(12)]
          flag=[Image.open(root/f'r2_flag_right_{i}.png') for i in range(12)]
          top=[Image.open(root/f'r2_fire_top_{i}.png') for i in range(8)]
          bottom=[Image.open(root/f'r2_fire_bottom_{i}.png') for i in range(8)]
          trees=[Image.open(root/f'r2_trees_{i}.png') for i in range(12)]
          for im in river+flag+top+bottom+trees: im.load(); assert im.mode=='P'; assert 0 in set(im.getdata())
          for im in river:
              data=list(im.getdata())
              for y in range(63,109):
                  for x in range(49,80):
                      assert data[y*112+x]==0
          report=json.loads((root/'R2_REFINED_ANIM_REPORT.json').read_text(encoding='utf-8'))
          assert report['flag_static_removed_pixels']>90
          assert report['upper_warm_after'] < report['upper_warm_before']*0.75
          assert report['lower_warm_after'] < report['lower_warm_before']*0.75
          assert report['tree_static_removed_pixels']>=25
          print('Accepted R2 generated-resource verification PASS')
          PY
          OUT="/tmp/${PACKAGE_NAME}/ACCEPTED_R2_GENERATED_RESOURCES"
          cp sgdk/res/r2_menu_bg.png sgdk/res/r2_selector.png sgdk/res/r2_top_right_patch.png "$OUT/"
          cp sgdk/res/r2_river_*.png "$OUT/"
          cp sgdk/res/r2_flag_right_*.png "$OUT/"
          cp sgdk/res/r2_fire_top_*.png sgdk/res/r2_fire_bottom_*.png "$OUT/"
          cp sgdk/res/r2_trees_*.png "$OUT/"
          cp sgdk/res/R2_REFINED_ANIM_REPORT.json "$OUT/"
          (cd "$OUT" && sha256sum * > RESOURCE_SHA256.txt)

      - name: Pin SGDK 2.11
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$SGDK_IMAGE"
          ID="$(docker image inspect "$SGDK_IMAGE" --format '{{.Id}}')"
          DIGEST="$(docker image inspect "$SGDK_IMAGE" --format '{{index .RepoDigests 0}}')"
          echo "SGDK_IMAGE_ID=$ID" >> "$GITHUB_ENV"
          printf '%s\n' "$ID" > "/tmp/${PACKAGE_NAME}/ACCEPTED_R2_BUILD/SGDK_IMAGE_ID.txt"
          printf '%s\n' "$DIGEST" > "/tmp/${PACKAGE_NAME}/ACCEPTED_R2_BUILD/SGDK_IMAGE_DIGEST.txt"

      - name: Two reproducible SGDK builds
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/sgdk-backup-a /tmp/sgdk-backup-b
          cp -a sgdk /tmp/sgdk-backup-a
          cp -a sgdk /tmp/sgdk-backup-b
          chmod -R a+rwX /tmp/sgdk-backup-a /tmp/sgdk-backup-b
          docker run --rm -v /tmp/sgdk-backup-a:/m68k "$SGDK_IMAGE_ID"
          docker run --rm -v /tmp/sgdk-backup-b:/m68k "$SGDK_IMAGE_ID"
          cmp /tmp/sgdk-backup-a/out/rom.bin /tmp/sgdk-backup-b/out/rom.bin
          ACTUAL_SHA="$(sha256sum /tmp/sgdk-backup-a/out/rom.bin | awk '{print $1}')"
          test "$ACTUAL_SHA" = "$ACCEPTED_R2_ROM_SHA256"
          OUT="/tmp/${PACKAGE_NAME}/ACCEPTED_R2_BUILD"
          cp /tmp/sgdk-backup-a/out/rom.bin "$OUT/Modern_Tanks_R2_ACCEPTED.bin"
          printf '%s  %s\n' "$ACTUAL_SHA" 'Modern_Tanks_R2_ACCEPTED.bin' > "$OUT/ROM_SHA256.txt"
          printf '%s\n' 'PASS: Build A and Build B are byte-for-byte identical.' > "$OUT/REPRODUCIBILITY.txt"
          python3 sgdk/tools/verify_rom.py "$OUT/Modern_Tanks_R2_ACCEPTED.bin" | tee "$OUT/ROM_AUDIT.json"

      - name: Build backup reports and manifest
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="/tmp/${PACKAGE_NAME}"
          cp sgdk/res/R2_REFINED_ANIM_REPORT.json "$PACKAGE/ACCEPTED_R2_BUILD/"
          cp BACKUP_CONTENTS.md "$PACKAGE/"
          cat > "$PACKAGE/ACCEPTED_R2_BUILD/BUILD_REPORT.md" <<REPORT
          # Modern Tanks — Accepted R2 backup build
          - Accepted gameplay baseline: ${ACCEPTED_R2_COMMIT}
          - Backup documentation commit: ${GITHUB_SHA}
          - SGDK: 2.11 pinned Docker image
          - ROM size: 131072 bytes
          - ROM SHA-256: ${ACCEPTED_R2_ROM_SHA256}
          - Reproducibility: PASS, two builds byte-for-byte identical
          - ROM audit: PASS
          - R0: ACCEPTED / CLOSED
          - R1: ACCEPTED / CLOSED
          - R2: ACCEPTED / CLOSED by owner emulator test
          - R3: NEXT / UNBLOCKED / NOT STARTED
          REPORT
          (cd "$PACKAGE" && find . -type f ! -name FILE_MANIFEST_SHA256.txt -print0 | sort -z | xargs -0 sha256sum > FILE_MANIFEST_SHA256.txt)
          cd /tmp
          rm -f "${PACKAGE_NAME}.zip" "${PACKAGE_NAME}.zip.sha256.txt"
          zip -qr "${PACKAGE_NAME}.zip" "${PACKAGE_NAME}"
          sha256sum "${PACKAGE_NAME}.zip" > "${PACKAGE_NAME}.zip.sha256.txt"
          ls -lh "${PACKAGE_NAME}.zip"

      - name: Publish full accepted project backup
        uses: actions/upload-artifact@v4
        with:
          name: Modern_Tanks_FULL_PROJECT_R2_ACCEPTED_2026-09-09
          path: |
            /tmp/Modern_Tanks_FULL_PROJECT_R2_ACCEPTED_2026-09-09.zip
            /tmp/Modern_Tanks_FULL_PROJECT_R2_ACCEPTED_2026-09-09.zip.sha256.txt
          if-no-files-found: error
          retention-days: 90

name: R3 Toolchain Export

on:
  push:
    branches:
      - r3-live-map01-rom-v1
    paths:
      - '.github/workflows/r3-toolchain-export.yml'
  workflow_dispatch:

jobs:
  export-toolchain:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download pinned SGDK 2.11 and m68k GCC 13.2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p toolchain
          curl -fL --retry 4 --retry-delay 2 \
            -o toolchain/sgdk-v2.11-linux-x86_64.tar.gz \
            https://github.com/ulalume/sgdk-native-builds/releases/download/v2.11/sgdk-v2.11-linux-x86_64.tar.gz
          curl -fL --retry 4 --retry-delay 2 \
            -o toolchain/m68k-elf-toolchain-gcc13.2.0-linux-x86_64.tar.gz \
            https://github.com/ulalume/m68k-toolchain-builds/releases/download/gcc13.2.0-1/m68k-elf-toolchain-gcc13.2.0-linux-x86_64.tar.gz
          echo '351a4c4d1b6a0930d10bb529ac2274e4875aba1bf94b646ce16332b8b7b05ff8  toolchain/sgdk-v2.11-linux-x86_64.tar.gz' | sha256sum -c -
          echo '5540f36310990f64f699a47094fba4bdf078adef279f4f0ec54bac3b101b5bf9  toolchain/m68k-elf-toolchain-gcc13.2.0-linux-x86_64.tar.gz' | sha256sum -c -
          sha256sum toolchain/* > toolchain/SHA256SUMS.txt
          ls -lh toolchain

      - name: Upload pinned toolchain
        uses: actions/upload-artifact@v4
        with:
          name: R3_SGDK_2_11_M68K_GCC_13_2_LINUX_X86_64
          path: toolchain/
          if-no-files-found: error
          retention-days: 7
